name: Normalize New API Risk Platform Release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/newapi-risk-platform-release-20260901
    paths:
      - newapi-risk-platform/**
      - .github/workflows/newapi-risk-platform-normalize.yml

permissions:
  contents: write

concurrency:
  group: newapi-risk-platform-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[release-normalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/newapi-risk-platform-release-20260901
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: newapi-risk-platform/go.sum

      - name: Normalize and validate project
        working-directory: newapi-risk-platform
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          go test ./...
          go vet ./...

      - name: Commit normalized files when required
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newapi-risk-platform
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "chore(risk-platform): normalize release files [release-normalized]"
          git push origin HEAD:feat/newapi-risk-platform-release-20260901
