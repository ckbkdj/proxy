name: New API Risk Platform CI

on:
  push:
    branches:
      - feat/newapi-risk-platform-release-20260901
    paths:
      - newapi-risk-platform/**
      - .github/workflows/newapi-risk-platform-ci.yml
  pull_request:
    paths:
      - newapi-risk-platform/**
      - .github/workflows/newapi-risk-platform-ci.yml

permissions:
  contents: read

concurrency:
  group: newapi-risk-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: newapi-risk-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Resolve modules
        run: go mod tidy
      - name: Format sources
        run: gofmt -w ./cmd ./internal
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: Build service
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd

  container-smoke:
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: newapi-risk-platform
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL Redis and service
        env:
          POSTGRES_PASSWORD: ci-postgres-password-with-sufficient-length
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
          BIND_ADDRESS: 127.0.0.1
          HTTP_PORT: "18080"
          APP_ENV: production
          KAFKA_ENABLED: "false"
        run: docker compose up -d --build postgres redis risk-platform
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/healthz
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify admin login
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/admin/v1/login \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"ci-admin-password-with-sufficient-length"}' \
            | grep -q 'access_token'
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
